name: Build Android APK
on:
  push:
    branches: [main, codex/gallery-bridge-home]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Publish only the newest preview for a branch; concurrent older builds must
# not replace the Release APK with stale code.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build and test
        run: gradle --no-daemon testDebugUnitTest assembleDebug
      - name: Configure optional persistent preview signing
        if: github.ref != 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.GALLERY_BRIDGE_PREVIEW_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.GALLERY_BRIDGE_PREVIEW_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.GALLERY_BRIDGE_PREVIEW_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.GALLERY_BRIDGE_PREVIEW_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Preview uses a temporary debug signing key. Future in-place upgrades need the repository signing secrets."
            exit 0
          fi
          test -n "$STORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/gallerybridge-preview.jks"
          test -s "$RUNNER_TEMP/gallerybridge-preview.jks"
          echo "GB_PREVIEW_KEYSTORE_FILE=$RUNNER_TEMP/gallerybridge-preview.jks" >> "$GITHUB_ENV"
          echo "GB_PREVIEW_STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "GB_PREVIEW_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GB_PREVIEW_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
      - name: Build standalone recovery APK
        if: github.ref != 'refs/heads/main'
        run: gradle --no-daemon clean -PgalleryBridgePreview=true assembleDebug
      - name: Verify archive, APK signature and recovery package ID
        if: github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -tq "$APK" | tail -n 1
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -F "name='com.gallerybridge.app.preview.recovery'"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        if: github.ref != 'refs/heads/main'
        with:
          name: GalleryBridge-preview-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: GalleryBridge-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  android-ui:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK and prepare the emulator
        run: |
          set -euo pipefail
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          "$sdkmanager" 'platforms;android-36' 'build-tools;36.0.0' platform-tools emulator 'system-images;android-35;default;x86_64'
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          export ANDROID_AVD_HOME="$RUNNER_TEMP/gallery-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name gallery-ui --package 'system-images;android-35;default;x86_64' --device pixel_4 \
            --path "$ANDROID_AVD_HOME/gallery-ui.avd"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx gallery-ui
      - name: Test Home, search, navigation and theme on Android
        run: |
          set -euo pipefail
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd gallery-ui -no-window -no-audio -no-snapshot \
            -gpu swiftshader_indirect -no-metrics -no-boot-anim > "$RUNNER_TEMP/gallery-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          if ! timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do kill -0 "$1" || exit 1; sleep 2; done' bash "$emulator_pid"; then
            tail -n 60 "$RUNNER_TEMP/gallery-emulator.log"
            exit 1
          fi
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          gradle --no-daemon -PgalleryBridgePreview=true connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-results
          path: |
            app/build/outputs/androidTest-results/connected/
            ${{ runner.temp }}/gallery-emulator.log

  publish:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GalleryBridge-debug-apk
      - name: Publish public APK in GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION"
          TAG="v$VERSION"
          FILE="GalleryBridge-v$VERSION.apk"
          mv app-debug.apk "$FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --target "$GITHUB_SHA" \
              --title "Gallery Bridge $TAG" \
              --notes "Тестовая Android APK GALLERY BRIDGE $TAG. Скачайте APK в разделе Assets. Сборка с отладочной подписью; для постоянных обновлений нужна стабильная подпись."
          fi

  install-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/gallery-bridge-home'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android emulator
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' platform-tools emulator 'system-images;android-35;default;x86_64'
          sudo chown "$(id -u):$(id -g)" /dev/kvm
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          export ANDROID_AVD_HOME="$RUNNER_TEMP/gallery-avds"
          mkdir -p "$ANDROID_AVD_HOME"
          echo "ANDROID_AVD_HOME=$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name gallery-install --package 'system-images;android-35;default;x86_64' \
            --device pixel_4 --path "$ANDROID_AVD_HOME/gallery-install.avd"
      - uses: actions/download-artifact@v4
        with:
          name: GalleryBridge-preview-apk
      - name: Install and launch preview package on Android
        run: |
          set -euo pipefail
          adb start-server
          "$ANDROID_HOME/emulator/emulator" -avd gallery-install -no-window -no-audio \
            -no-snapshot -gpu swiftshader_indirect -no-metrics -no-boot-anim \
            > "$RUNNER_TEMP/gallery-install-emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'kill "$emulator_pid" 2>/dev/null || true' EXIT
          if ! timeout 210 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do kill -0 "$1" || exit 1; sleep 2; done' bash "$emulator_pid"; then
            tail -n 70 "$RUNNER_TEMP/gallery-install-emulator.log"
            exit 1
          fi
          adb shell input keyevent KEYCODE_WAKEUP
          adb shell wm dismiss-keyguard
          adb install -r app-debug.apk
          adb shell pm path com.gallerybridge.app.preview.recovery | grep -F "package:"
          adb shell monkey -p com.gallerybridge.app.preview.recovery -c android.intent.category.LAUNCHER 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-install-smoke-log
          path: ${{ runner.temp }}/gallery-install-emulator.log

  publish-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/codex/gallery-bridge-home'
    needs: [build, install-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GalleryBridge-preview-apk
      - name: Publish directly downloadable preview APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="preview-recovery"
          FILE="GalleryBridge-preview-recovery.apk"
          test -s app-debug.apk
          mv app-debug.apk "$FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" --prerelease \
              --target "$GITHUB_SHA" \
              --title "Gallery Bridge Preview Recovery 0.28" \
              --notes "Separate recovery package (com.gallerybridge.app.preview.recovery). Installs alongside older preview. Existing preview catalog, queue and settings remain in the old app, and are not transferred automatically. Verified APK signature and Android emulator installation. For future upgrades, configure a persistent signing key via GitHub Actions secrets."
          fi
